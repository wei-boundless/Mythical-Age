<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎪 马戏团 - 跳火圈 经典再现</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', 'Microsoft YaHei', monospace;
    overflow: hidden;
  }
  .game-wrapper {
    background: #1a0a2e;
    border: 4px solid #ff6b35;
    border-radius: 12px;
    padding: 4px;
    box-shadow: 0 0 50px rgba(255,107,53,0.3);
  }
  canvas {
    display: block;
    border-radius: 8px;
    background: #1a1a3a;
    image-rendering: pixelated;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: linear-gradient(90deg, #cc3333, #ff6b35, #cc3333);
    border-radius: 8px 8px 0 0;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  .info-bar .t { font-size: 17px; letter-spacing: 2px; }
  .info-bar .right span { margin-left: 18px; }
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    padding: 6px 16px;
    background: linear-gradient(90deg, #cc3333, #ff6b35, #cc3333);
    border-radius: 0 0 8px 8px;
    color: #ffd700;
    font-size: 13px;
    font-weight: bold;
  }
  .bottom-bar kbd {
    background: #1a0a2e;
    color: #ffd700;
    padding: 1px 7px;
    border-radius: 3px;
    border: 1px solid #ffd700;
    font-size: 12px;
  }
  #overlay {
    position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: rgba(0,0,0,0.75);
    border-radius: 8px; z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay h1 { font-size: 40px; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 4px; }
  #overlay h2 { font-size: 28px; color: #ff6b35; margin: 4px 0; }
  #overlay p { font-size: 16px; color: #ddd; margin: 3px 0; }
  #overlay .high { font-size: 14px; color: #ffd700; margin-top: 6px; }
  #overlay .btn {
    margin-top: 18px; padding: 12px 44px; font-size: 22px; font-weight: bold;
    color: #1a0a2e; background: linear-gradient(90deg, #ffd700, #ff6b35);
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 25px rgba(255,215,0,0.3);
    transition: transform 0.15s;
  }
  #overlay .btn:hover { transform: scale(1.07); }
  #overlay .tips { font-size: 13px; color: #999; margin-top: 10px; }
</style>
</head>
<body>
<div class="game-wrapper" style="position:relative;">
  <div class="info-bar">
    <span class="t">🎪 马戏团 — 跳火圈</span>
    <span class="right"><span>🏆 <span id="hiDisplay">0</span></span></span>
  </div>
  <div style="position:relative;">
    <canvas id="gc" width="800" height="500"></canvas>
    <div id="overlay" class="show">
      <h1>🎪 跳火圈</h1>
      <p style="font-size:18px;color:#ffd700;">Circus — Fire Rings</p>
      <p style="font-size:14px;color:#bbb;">🔥 秋千摆动 → 看准时机跳跃 → 钻过火圈 → 抓住下一根秋千</p>
      <button class="btn" id="startBtn">🎪 开始表演</button>
      <div class="tips"><kbd>↑</kbd> / <kbd>空格</kbd> 跳跃 &nbsp;|&nbsp; ← → 微调摆动</div>
    </div>
  </div>
  <div class="bottom-bar">
    <span>🔥 已过 <span id="scoreDisplay">0</span> 圈</span>
    <span>❤️ <span id="livesDisplay">3</span></span>
    <span>📏 <span id="distDisplay">0</span>m</span>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;
const scoreSpan = document.getElementById('scoreDisplay');
const livesSpan = document.getElementById('livesDisplay');
const distSpan = document.getElementById('distDisplay');
const hiSpan = document.getElementById('hiDisplay');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let gameRunning = false;
let ringsPassed = 0;
let lives = 3;
let distance = 0;
let hiScore = parseInt(localStorage.getItem('circusFireRingHi')) || 0;
hiSpan.textContent = hiScore;
let frame = 0;

// Scroll system — world keeps moving left
let scrollSpeed = 2.0;
let worldX = 0; // world scroll offset (increases, meaning world moves left)

// Player
const player = {
  x: 180, y: 0,
  vx: 0, vy: 0,
  dir: 1,
  state: 'swing', // swing | flying | landing | fall | dead
  swingAngle: 0,
  swingSpeed: 0,
  onTrapeze: true,
  grabX: 0, grabY: 0,
  rotation: 0,
  animTimer: 0,
};

// World objects
let trapezes = [];
let fireRings = [];
let particles = [];
let totalRingsGenerated = 0;
let nextSpawnX = 600;
let lastTrapezeX = 0;
let gameOverTimer = 0;
let readyForNext = false;

// Keys
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'ArrowUp') && player.state === 'swing' && gameRunning) {
    e.preventDefault();
    doJump();
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('click', () => {
  if (player.state === 'swing' && gameRunning) doJump();
});

// ---- Initialize level ----
function initLevel() {
  trapezes = [];
  fireRings = [];
  particles = [];
  worldX = 0;
  distance = 0;
  scrollSpeed = 2.0;
  totalRingsGenerated = 0;
  nextSpawnX = 400;
  lastTrapezeX = 0;
  readyForNext = false;
  gameOverTimer = 0;

  // Starting trapeze
  trapezes.push({ x: 200, y: 90 });
  lastTrapezeX = 200;
  
  attachToTrapeze(0);
  
  // Generate initial objects ahead
  generateAhead(800);
}

function attachToTrapeze(idx) {
  const t = trapezes[idx];
  if (!t) return;
  player.x = t.x;
  player.y = t.y + 18;
  player.onTrapeze = true;
  player.grabX = t.x;
  player.grabY = t.y;
  player.swingAngle = -0.3;
  player.swingSpeed = 0.025;
  player.vx = 0;
  player.vy = 0;
  player.rotation = 0;
  player.state = 'swing';
  player.animTimer = 0;
}

function generateAhead(viewportRight) {
  // Generate trapezes and rings ahead of the viewport
  while (nextSpawnX < viewportRight + 600) {
    const ringGap = 180 + Math.random() * 60;
    const ringX = nextSpawnX + ringGap;
    const ringY = 160 + Math.random() * 80;
    const ringH = 45 + Math.random() * 20;
    const ringW = 30 + Math.random() * 15;
    
    fireRings.push({
      x: ringX, y: ringY, w: ringW, h: ringH,
      passed: false,
      firePhase: Math.random() * Math.PI * 2,
    });
    totalRingsGenerated++;
    
    // Trapeze after this ring
    const trapGap = 80 + Math.random() * 60;
    const trapX = ringX + 50 + Math.random() * 40;
    trapezes.push({ x: trapX, y: 75 + Math.random() * 25 });
    
    nextSpawnX = trapX + trapGap;
    lastTrapezeX = trapX;
  }
}

function doJump() {
  if (player.state !== 'swing') return;
  
  const speed = 7.0;
  player.vx = Math.sin(player.swingAngle) * speed * 1.1 + 3.5; // always go forward
  player.vy = -Math.cos(player.swingAngle) * speed - 1.0;
  player.onTrapeze = false;
  player.state = 'flying';
  player.rotation = player.swingAngle * 0.3;
}

// ---- Drawing ----
function drawSky(worldOffset) {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  grad.addColorStop(0, '#0a0a2a');
  grad.addColorStop(0.3, '#1a1a4a');
  grad.addColorStop(0.6, '#2a1a3a');
  grad.addColorStop(1, '#1a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Stars with parallax (slow)
  for (let i = 0; i < 35; i++) {
    const sx = ((i * 137 + 50) % 1000) - worldOffset * 0.05 % 1000;
    const sy = (i * 89 + 20) % (H * 0.35);
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(frame * 0.02 + i * 2.7));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.fillRect(((sx % W) + W) % W, sy, 1.5, 1.5);
  }
  
  // Moon
  const moonX = 650 - worldOffset * 0.03;
  const moonY = 55;
  ctx.fillStyle = '#ffe4b5';
  ctx.shadowColor = '#ffe4b5';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(moonX, moonY, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawTentBg(worldOffset) {
  // Moving circus tent in background with parallax
  const tents = [-200, 300, 800, 1300, 1800];
  tents.forEach(baseX => {
    const cx = ((baseX - worldOffset * 0.2) % 1600 + 1600) % 1600 - 200;
    if (cx < -200 || cx > W + 200) return;
    const cy = H * 0.2;
    
    // Tent stripes
    for (let i = -3; i <= 3; i++) {
      const segW = 28;
      const sx = cx + i * segW - segW/2;
      ctx.fillStyle = i % 2 === 0 ? '#cc2222' : '#ffffff';
      ctx.beginPath();
      ctx.moveTo(sx, cy + 40);
      ctx.lineTo(sx + segW, cy + 40);
      ctx.lineTo(cx + (i + 0.5) * segW * 1.5, cy - 60);
      ctx.lineTo(cx + (i - 0.5) * segW * 1.5, cy - 60);
      ctx.closePath();
      ctx.fill();
    }
    // Tent border
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx - 150, cy + 40);
    ctx.quadraticCurveTo(cx, cy - 65, cx + 150, cy + 40);
    ctx.stroke();
    // Flag
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 65);
    ctx.lineTo(cx + 16, cy - 52);
    ctx.lineTo(cx, cy - 39);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 39);
    ctx.lineTo(cx, cy - 72);
    ctx.stroke();
  });
}

function drawGround(worldOffset) {
  const floorY = H - 35;
  
  // Ground with parallax
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(0, floorY + 5, W, 35);
  
  // Circus ring border (moves with ground)
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 3;
  const ringCenterX = ((W/2 - worldOffset * 0.5) % 600 + 600) % 600;
  ctx.beginPath();
  ctx.arc(ringCenterX, floorY + 15, 150, Math.PI, 0);
  ctx.stroke();
  
  // Floor surface
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(0, floorY, W, 6);
  ctx.fillStyle = '#A0522D';
  ctx.fillRect(0, floorY, W, 2);
  
  // Poles for trapezes (decorative)
  for (let i = 0; i < 8; i++) {
    const px = ((i * 280 + 50 - worldOffset * 0.3) % 2400 + 2400) % 2400 - 100;
    if (px < -20 || px > W + 20) continue;
    ctx.fillStyle = '#666';
    ctx.fillRect(px, H * 0.15, 5, H * 0.7);
    ctx.fillStyle = '#888';
    ctx.fillRect(px - 2, H * 0.15, 9, 4);
  }
}

function drawTrapeze(t, highlight, worldOffset) {
  const sx = t.x - worldOffset;
  if (sx < -60 || sx > W + 60) return;
  
  // Top support bar (decorative structure above)
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(sx, t.y - 40);
  ctx.lineTo(sx, t.y);
  ctx.stroke();
  
  // Ropes
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx - 18, t.y);
  ctx.lineTo(sx - 18, t.y + 42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sx + 18, t.y);
  ctx.lineTo(sx + 18, t.y + 42);
  ctx.stroke();
  
  // Bar
  ctx.fillStyle = highlight ? '#ffd700' : '#c0a060';
  ctx.shadowColor = highlight ? '#ffd700' : 'transparent';
  ctx.shadowBlur = highlight ? 10 : 0;
  ctx.fillRect(sx - 20, t.y - 2, 40, 5);
  ctx.shadowBlur = 0;
}

function drawFireRing(ring, worldOffset) {
  const sx = ring.x - worldOffset;
  if (sx < -80 || sx > W + 80) return;
  
  const alpha = ring.passed ? 0.2 : 1;
  ctx.globalAlpha = alpha;
  
  // Outer glow
  const glow = 6 + 4 * Math.sin(frame * 0.06 + ring.firePhase);
  const grad = ctx.createRadialGradient(sx, ring.y + ring.h/2, 2, sx, ring.y + ring.h/2, ring.h/2 + glow);
  grad.addColorStop(0, 'rgba(255,120,0,0)');
  grad.addColorStop(0.6, 'rgba(255,80,0,0.12)');
  grad.addColorStop(1, 'rgba(255,30,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(sx, ring.y + ring.h/2, ring.w/2 + glow, ring.h/2 + glow, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Fire ring ellipse
  ctx.strokeStyle = '#ff3300';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#ff6600';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.ellipse(sx, ring.y + ring.h/2, ring.w/2, ring.h/2, 0, 0, Math.PI * 2);
  ctx.stroke();
  
  // Inner glow
  ctx.shadowBlur = 0;
  const grad2 = ctx.createRadialGradient(sx, ring.y + ring.h/2, 1, sx, ring.y + ring.h/2, ring.h/2 - 4);
  grad2.addColorStop(0, 'rgba(255,200,50,0.08)');
  grad2.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.ellipse(sx, ring.y + ring.h/2, ring.w/2 - 3, ring.h/2 - 3, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Flame tips
  for (let i = -2; i <= 2; i++) {
    const fx = sx + i * (ring.w / 5);
    const fy = ring.y + 2 + 3 * Math.sin(frame * 0.1 + i * 1.3 + ring.firePhase);
    const fh = 5 + 5 * Math.sin(frame * 0.12 + i * 1.7 + ring.firePhase);
    ctx.fillStyle = `rgba(255, ${140 + Math.random() * 60}, 0, 0.6)`;
    ctx.beginPath();
    ctx.moveTo(fx - 2.5, fy);
    ctx.quadraticCurveTo(fx, fy - fh, fx + 2.5, fy);
    ctx.fill();
  }
  
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawCharlie(x, y, dir, rotation, state) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  
  // Body
  const bw = 18, bh = 26;
  const bGrad = ctx.createLinearGradient(-bw/2, 0, bw/2, 0);
  bGrad.addColorStop(0, '#ff3333');
  bGrad.addColorStop(0.35, '#ffd700');
  bGrad.addColorStop(0.65, '#3388ff');
  bGrad.addColorStop(1, '#ff3333');
  ctx.fillStyle = bGrad;
  ctx.fillRect(-bw/2, -bh + 5, bw, bh);
  
  // Collar ruffle
  ctx.fillStyle = '#ff69b4';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.arc(i * 4, -bh + 8, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Head
  ctx.fillStyle = '#ffddbb';
  ctx.beginPath();
  ctx.arc(0, -bh - 3, 11, 0, Math.PI * 2);
  ctx.fill();
  
  // Hat
  ctx.fillStyle = '#ff3333';
  ctx.beginPath();
  ctx.moveTo(-13, -bh - 5);
  ctx.lineTo(13, -bh - 5);
  ctx.lineTo(2, -bh - 30);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(2, -bh - 30, 3.5, 0, Math.PI * 2);
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(-3.5, -bh - 5, 2, 0, Math.PI * 2);
  ctx.arc(3.5, -bh - 5, 2, 0, Math.PI * 2);
  ctx.fill();
  
  // Nose
  ctx.fillStyle = '#ff2222';
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.arc(0, -bh, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Smile
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -bh + 3, 4.5, 0.2, Math.PI - 0.2);
  ctx.stroke();
  
  // Legs
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  
  if (state === 'swing') {
    // Dangling legs
    const legSwing = 3 * Math.sin(frame * 0.08);
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(-7, 12 + legSwing);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, 4);
    ctx.lineTo(7, 12 - legSwing);
    ctx.stroke();
    
    // Arms reaching up
    ctx.strokeStyle = '#ffddbb';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-bw/2, -bh + 10);
    ctx.lineTo(-bw/2 - 2, -bh - 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bw/2, -bh + 10);
    ctx.lineTo(bw/2 + 2, -bh - 4);
    ctx.stroke();
  } else if (state === 'flying') {
    // Spread out for flying
    ctx.strokeStyle = '#ffddbb';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-bw/2, -bh + 8);
    ctx.lineTo(-bw/2 - 9, -bh + 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bw/2, -bh + 8);
    ctx.lineTo(bw/2 + 9, -bh + 2);
    ctx.stroke();
    
    // Tucked legs when flying
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(-6, 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, 4);
    ctx.lineTo(6, 10);
    ctx.stroke();
  } else {
    // Falling - flailing
    ctx.strokeStyle = '#ffddbb';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-bw/2, -bh + 8);
    ctx.lineTo(-bw/2 - 12, -bh + 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bw/2, -bh + 8);
    ctx.lineTo(bw/2 + 8, -bh + 0);
    ctx.stroke();
    
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-4, 4);
    ctx.lineTo(-10, 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, 4);
    ctx.lineTo(2, 14);
    ctx.stroke();
  }
  
  // Shoes
  ctx.fillStyle = '#8B4513';
  const shoeY = state === 'swing' ? 14 + 3 * Math.sin(frame * 0.08) : 14;
  ctx.beginPath();
  ctx.ellipse(-7, shoeY, 7, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(7, shoeY, 7, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

// ---- Particles ----
function addParticles(x, y, color, count, spd) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * spd + 1;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1,
      life: 25 + Math.random() * 25, maxLife: 50,
      size: 1.5 + Math.random() * 3, color,
    });
  }
}

function addTextParticle(x, y, text, color) {
  particles.push({
    x, y, vx: 0, vy: -2.2, life: 40, maxLife: 40, size: 0,
    color, isText: true, text, size: 0,
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    if (p.isText) {
      ctx.font = 'bold 17px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillText(p.text, p.x, p.y);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });
}

// ---- Game logic ----
function update() {
  if (!gameRunning) return;
  if (gameOverTimer > 0) { gameOverTimer--; return; }
  
  // Scroll forward - this is the key mechanic!
  worldX += scrollSpeed;
  distance += scrollSpeed * 0.05;
  distSpan.textContent = Math.floor(distance);
  
  // Gradually increase speed
  scrollSpeed = 2.0 + distance * 0.003;
  if (scrollSpeed > 5) scrollSpeed = 5;
  
  // Generate more obstacles ahead
  const viewRight = worldX + W;
  generateAhead(viewRight);
  
  // Remove passed objects behind
  fireRings = fireRings.filter(r => r.x > worldX - 200);
  trapezes = trapezes.filter(t => t.x > worldX - 200);
  // Update index after removal
  // (we'll find nearest trapeze by position)
  
  // ---- Player update ----
  if (player.state === 'swing') {
    // Find the trapeze player is on
    let currentTrap = null;
    for (const t of trapezes) {
      if (Math.abs(t.x - player.grabX) < 20) {
        currentTrap = t;
        break;
      }
    }
    
    if (currentTrap) {
      // Swing pendulum
      player.swingAngle += player.swingSpeed * Math.sin(frame * 0.04);
      
      // Player input affects swing
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.swingAngle -= 0.006;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) player.swingAngle += 0.006;
      
      // Clamp
      if (player.swingAngle > 0.7) player.swingAngle = 0.7;
      if (player.swingAngle < -0.7) player.swingAngle = -0.7;
      
      player.x = currentTrap.x + Math.sin(player.swingAngle) * 45;
      player.y = currentTrap.y + 18 + Math.cos(player.swingAngle) * 45;
      player.dir = Math.sin(player.swingAngle) > 0 ? 1 : -1;
      player.rotation = player.swingAngle * 0.25;
      player.grabX = currentTrap.x;
      player.grabY = currentTrap.y;
    }
  }
  
  if (player.state === 'flying') {
    player.x += player.vx;
    player.y += player.vy;
    player.vy += 0.22; // gravity
    player.rotation += player.vx * 0.015;
    if (player.rotation > 0.4) player.rotation = 0.4;
    if (player.rotation < -0.4) player.rotation = -0.4;
    
    // Check fire ring collisions
    for (const ring of fireRings) {
      if (ring.passed) continue;
      
      const dx = player.x - ring.x;
      const dy = (player.y + 8) - (ring.y + ring.h/2);
      const rxNorm = dx / (ring.w/2 + 4);
      const ryNorm = dy / (ring.h/2 + 4);
      const dist = Math.sqrt(rxNorm * rxNorm + ryNorm * ryNorm);
      
      // Passed through center of ring
      if (dist < 1.0 && Math.abs(dx) < ring.w/2) {
        ring.passed = true;
        ringsPassed++;
        scoreSpan.textContent = ringsPassed;
        
        const sx = ring.x - worldX;
        addParticles(sx, ring.y + ring.h/2, '#ffd700', 12, 3);
        addTextParticle(sx, ring.y, '🔥 钻过去了!', '#ffd700');
        break;
      }
      
      // Hit the fire edge
      if (dist < 1.3 && Math.abs(dx) < ring.w/2 + 10 && player.vy > -2) {
        const sx = ring.x - worldX;
        addParticles(sx, ring.y + ring.h/2, '#ff4400', 15, 4);
        addTextParticle(sx, ring.y - 20, '🔥 烫到了!', '#ff4400');
        startFall();
        return;
      }
    }
    
    // Check landing on trapeze
    let landed = false;
    for (const t of trapezes) {
      if (Math.abs(t.x - player.grabX) < 20) continue; // skip current
      const dx = Math.abs(player.x - t.x);
      const dy = Math.abs((player.y + 12) - (t.y + 42));
      
      if (dx < 20 && dy < 15 && player.vy > 0) {
        // Land!
        player.x = t.x;
        player.y = t.y + 18;
        player.grabX = t.x;
        player.grabY = t.y;
        player.swingAngle = -0.3;
        player.rotation = 0;
        player.vx = 0;
        player.vy = 0;
        player.state = 'swing';
        player.onTrapeze = true;
        landed = true;
        
        const sx = t.x - worldX;
        addParticles(sx, t.y + 42, '#ffd700', 6, 2);
        break;
      }
    }
    
    if (landed) return;
    
    // Fell off screen
    if (player.y > H || player.x < worldX - 50) {
      startFall();
    }
  }
  
  // Fall state
  if (player.state === 'fall') {
    player.vy += 0.3;
    player.y += player.vy;
    player.rotation += 0.1;
    
    if (player.y > H - 25) {
      // Hit ground
      lives--;
      livesSpan.textContent = lives;
      addParticles(player.x - worldX, H - 30, '#ff4400', 20, 4);
      
      if (lives <= 0) {
        gameOver();
      } else {
        // Respawn
        setTimeout(() => {
          // Find the last trapeze that is still behind or at current view
          let bestIdx = 0;
          let bestDist = Infinity;
          for (let i = 0; i < trapezes.length; i++) {
            const t = trapezes[i];
            if (t.x > worldX + 30) continue;
            const d = Math.abs(t.x - (worldX + 150));
            if (d < bestDist) {
              bestDist = d;
              bestIdx = i;
            }
          }
          player.state = 'swing';
          attachToTrapeze(bestIdx);
        }, 500);
      }
      player.state = 'dead';
    }
  }
}

function startFall() {
  if (player.state === 'fall' || player.state === 'dead') return;
  player.state = 'fall';
  player.vy = 3;
  player.vx *= 0.5;
}

function gameOver() {
  gameRunning = false;
  const fs = ringsPassed;
  if (fs > hiScore) {
    hiScore = fs;
    localStorage.setItem('circusFireRingHi', hiScore);
    hiSpan.textContent = hiScore;
  }
  overlay.innerHTML = `
    <h2>🎪 表演结束</h2>
    <p style="font-size:22px;color:#ffd700;">🔥 钻过 ${fs} 个火圈</p>
    <p style="font-size:14px;">📏 前进 ${Math.floor(distance)} 米</p>
    <p class="high">🏆 最高纪录：${hiScore} 圈</p>
    ${fs >= hiScore && fs > 0 ? '<p style="color:#ffd700;font-size:18px;">🎉 新纪录！</p>' : ''}
    <button class="btn" id="restartBtn">🔄 再来一次</button>
  `;
  overlay.classList.add('show');
  document.getElementById('restartBtn').addEventListener('click', () => {
    overlay.classList.remove('show');
    startGame();
  });
}

// ---- Render ----
function render() {
  ctx.clearRect(0, 0, W, H);
  
  drawSky(worldX);
  drawTentBg(worldX);
  drawGround(worldX);
  
  // Draw trapezes
  trapezes.forEach(t => {
    const onThis = player.state === 'swing' && Math.abs(t.x - player.grabX) < 20;
    drawTrapeze(t, onThis, worldX);
  });
  
  // Draw fire rings
  fireRings.forEach(r => drawFireRing(r, worldX));
  
  // Draw Charlie
  const px = player.x - worldX;
  if (player.state !== 'dead' || lives > 0) {
    drawCharlie(px, player.y, player.dir, player.rotation, player.state);
  }
  
  // Particles
  updateParticles();
  drawParticles();
  
  // HUD overlay
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 4;
  ctx.fillText(`🔥 ${ringsPassed} 圈`, 15, 22);
  ctx.fillText(`📏 ${Math.floor(distance)}m`, 15, 42);
  ctx.shadowBlur = 0;
}

// ---- Main loop ----
function gameLoop() {
  update();
  render();
  frame++;
  requestAnimationFrame(gameLoop);
}

// ---- Start ----
function startGame() {
  ringsPassed = 0;
  lives = 3;
  distance = 0;
  scoreSpan.textContent = '0';
  livesSpan.textContent = '3';
  distSpan.textContent = '0';
  initLevel();
  gameRunning = true;
  overlay.classList.remove('show');
}

startBtn.addEventListener('click', startGame);

// Initial draw + loop
initLevel();
gameRunning = false;
gameLoop();
</script>
</body>
